<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barangay San Miguel Portal — Community Issue Reporting &amp; Service Requests</title>
    <meta
      name="description"
      content="Submit community issue reports with photo evidence, request barangay clearance and certificates for pickup, and track submission progress by reference number."
    />
    <meta property="og:title" content="Barangay San Miguel Portal" />
    <meta
      property="og:description"
      content="Community issue reporting, document service requests, reference tracking, and barangay staff workflow portal."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var savedTheme = localStorage.getItem('barangay-theme');
        if (
          savedTheme === 'dark' ||
          (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F5F3EE] text-[#1F241D] dark:bg-[#141814] dark:text-[#F2F0EA] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
